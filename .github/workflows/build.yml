# Every push: does it still compile?
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      # API 37 ships as a minor-versioned platform, so the package id is
      # "android-37.0", not "android-37". Tolerant on purpose: if the id changes
      # again, AGP can still fetch the platform itself, and the listing below
      # makes a failure diagnosable instead of mysterious.
      - name: Install the SDK pieces this project needs
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;37.0.0" || true
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37" || true
          sdkmanager --list_installed | grep -E "platforms|build-tools" || true
      - run: ./gradlew --no-daemon testDebugUnitTest
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
