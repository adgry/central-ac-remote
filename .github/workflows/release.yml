# Tag a commit v1.2.3 and push it; this builds a signed APK and attaches it to
# the GitHub release. That release is exactly what the app's in-app updater looks
# for, so the loop is: bump versionName, tag, push, phones see it within a day.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the SDK pieces this project needs
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — the APK would be unsigned"
            echo "::error::and could not install over an existing copy. See README."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build the release APK
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check it really is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "built $APK"
          case "$APK" in *unsigned*)
            echo "::error::build produced an unsigned APK"; exit 1;;
          esac
          cp "$APK" "central-ac-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: central-ac-*.apk
          generate_release_notes: true
